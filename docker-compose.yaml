# One service, one port. The `mariweb` route is gone with nginx: it served a
# second copy of the generated site, which GitHub Pages already hosts.
#
# Configuration lives in a `.env` file beside this one — see .env.example.
#
# The service used to be called `mariadmin`, so the first deploy over the old
# one has to be `docker compose down` with the *old* file first. Otherwise the
# previous container keeps running and keeps its labels, two routers claim
# mari.basta.one, and which one Traefik picks is anybody's guess.

services:
  mari:
    build:
      context: .
      # Baked in, not passed at run time: the container needs a real account
      # for this uid, because ssh will not start without one. See the Dockerfile.
      args:
        MARI_UID: ${MARI_UID:?set MARI_UID to the checkout owner's uid}
        MARI_GID: ${MARI_GID:?set MARI_GID}
    image: mari
    container_name: mari
    restart: unless-stopped

    # The whole checkout, not just the data directories. api.py commits and
    # pushes it, so it needs a real .git; mounting `./images` and `./src/data`
    # alone gave the container two directories and no repository.
    volumes:
      - ./:/app
      # Write access to HSTEP/marimagdalena and nothing else. Scoped to the one
      # repository by construction rather than by remembering to scope it, and
      # never part of a URL, so it cannot leak into .git/config or a log line.
      - ${MARI_DEPLOY_KEY:?set MARI_DEPLOY_KEY to the deploy key on this host}:/run/secrets/deploy_key:ro

    # env_file rather than a list of `environment:` entries, so that adding a
    # setting is editing one file on the server and not editing this one and
    # remembering to pass it through.
    env_file:
      - .env

    healthcheck:
      # `/` redirects to the app, so this fails while the bundle is missing —
      # which is exactly when the site looks up and is not.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.mari-http.rule=Host(`mari.basta.one`)"
      - "traefik.http.routers.mari-http.entrypoints=web"
      - "traefik.http.routers.mari-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.mari-http.service=mari"

      - "traefik.http.routers.mari-https.rule=Host(`mari.basta.one`)"
      - "traefik.http.routers.mari-https.entrypoints=websecure"
      - "traefik.http.routers.mari-https.tls=true"
      - "traefik.http.routers.mari-https.tls.certresolver=teeresolver"
      - "traefik.http.routers.mari-https.service=mari"

      - "traefik.http.services.mari.loadbalancer.server.port=8000"

      # The session cookie is Secure, so http would look like a login that
      # silently does nothing.
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
