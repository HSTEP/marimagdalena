[project]
name = "marimagdalena"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.103.2",
    # Signs the admin's session cookie. It arrives transitively today, but the
    # import in api.py is direct and must not depend on someone else's choice.
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.6",
    "pillow>=10.0.0",
    # iPhone photographs arrive as HEIC, which Pillow cannot open on its own.
    "pillow-heif>=0.16.0",
    "python-multipart>=0.0.8",
    "uvicorn>=0.22.0",
]
